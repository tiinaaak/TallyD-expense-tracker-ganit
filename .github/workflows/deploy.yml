name: TallyD CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend checks
        env:
          SECRET_KEY: ci-test-secret-key
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: ci-test-password
          DEFAULT_FROM_EMAIL: ci@example.com
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install and test
        run: |
          cd frontend
          npm ci
          CI=true npm test -- --watchAll=false

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build -t tallyd-backend:${{ github.sha }} ./backend

      - name: Tag backend image for ECR
        run: |
          docker tag tallyd-backend:${{ github.sha }} \
            975049960386.dkr.ecr.us-east-1.amazonaws.com/tallyd-backend:${{ github.sha }}

      - name: Push backend image to ECR
        run: |
          docker push \
            975049960386.dkr.ecr.us-east-1.amazonaws.com/tallyd-backend:${{ github.sha }}
