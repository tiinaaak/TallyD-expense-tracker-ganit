name: TallyD CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: 975049960386.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_REPOSITORY: tallyd-backend
  FRONTEND_REPOSITORY: tallyd-frontend
  BACKEND_SERVICE: tallyd-backend-service
  FRONTEND_SERVICE: tallyd-frontend-service
  BACKEND_TASK_FAMILY: tallyd-backend-task
  FRONTEND_TASK_FAMILY: tallyd-frontend-task
  ECS_CLUSTER: tallyd-cluster

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend checks
        env:
          SECRET_KEY: ci-test-secret-key
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: ci-test-password
          DEFAULT_FROM_EMAIL: ci@example.com
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install and test
        run: |
          cd frontend
          npm ci
          CI=true npm test -- --watchAll=false

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ github.sha }} \
            ./frontend

      - name: Push backend image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$BACKEND_REPOSITORY:${{ github.sha }}

      - name: Push frontend image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ github.sha }}

      - name: Prepare backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_FAMILY" \
            --query taskDefinition \
            --output json > backend-task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' backend-task-definition.json > backend-task-definition-clean.json

          jq \
            --arg IMAGE "$ECR_REGISTRY/$BACKEND_REPOSITORY:${{ github.sha }}" \
            '(.containerDefinitions[] | select(.name == "tallyd-backend") | .image) = $IMAGE' \
            backend-task-definition-clean.json \
            > backend-task-definition-new.json

      - name: Register backend task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://backend-task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text > backend-task-definition-arn.txt

      - name: Deploy backend to ECS
        run: |
          BACKEND_TASK_DEFINITION=$(cat backend-task-definition-arn.txt)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_SERVICE" \
            --task-definition "$BACKEND_TASK_DEFINITION"

      - name: Prepare frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FRONTEND_TASK_FAMILY" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' frontend-task-definition.json > frontend-task-definition-clean.json

          jq \
            --arg IMAGE "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ github.sha }}" \
            '(.containerDefinitions[] | select(.name == "tallyd-frontend") | .image) = $IMAGE' \
            frontend-task-definition-clean.json \
            > frontend-task-definition-new.json

      - name: Register frontend task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://frontend-task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text > frontend-task-definition-arn.txt

      - name: Deploy frontend to ECS
        run: |
          FRONTEND_TASK_DEFINITION=$(cat frontend-task-definition-arn.txt)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_SERVICE" \
            --task-definition "$FRONTEND_TASK_DEFINITION"

      - name: Wait for backend ECS service
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$BACKEND_SERVICE"

      - name: Wait for frontend ECS service
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$FRONTEND_SERVICE"

      - name: Verify backend health
        run: |
          curl --fail --show-error --silent \
            http://tallyd-backend-alb-2084154047.us-east-1.elb.amazonaws.com/api/health/

          echo
          echo "Backend health check passed."
