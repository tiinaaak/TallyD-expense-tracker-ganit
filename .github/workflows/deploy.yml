name: TallyD CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend checks
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install and test
        run: |
          cd frontend
          npm ci
          CI=true npm test -- --watchAll=false

      - name: Frontend build
        run: |
          cd frontend
          npm run build
